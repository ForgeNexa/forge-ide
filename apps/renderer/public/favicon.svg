<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222B" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <!-- Forge Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFEB3B" />
    </linearGradient>

    <!-- Anvil Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388BFD" />
      <stop offset="50%" stop-color="#1F6FEB" />
      <stop offset="100%" stop-color="#0D419D" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#shieldGrad)" stroke="#30363D" stroke-width="4" />

  <!-- Anvil Base & Body (Geometric Modern Stylized) -->
  <path d="M 120 360 L 392 360 C 404 360 412 372 406 382 L 388 412 C 382 422 370 428 358 428 L 154 428 C 142 428 130 422 124 412 L 106 382 C 100 372 108 360 120 360 Z" fill="#21262D" stroke="#388BFD" stroke-width="3" />

  <!-- Center Anvil Core -->
  <path d="M 172 260 L 340 260 L 320 360 L 192 360 Z" fill="url(#metalGrad)" opacity="0.9" />

  <!-- Anvil Horn & Face -->
  <path d="M 96 220 L 416 220 C 430 220 440 232 436 246 L 424 280 C 418 296 402 308 384 308 L 232 308 C 196 308 164 290 144 260 L 102 248 C 88 244 84 226 96 220 Z" fill="url(#metalGrad)" filter="url(#forgeGlow)" />

  <!-- Rising Spark / Flame from Anvil -->
  <path d="M 256 76 C 256 76 296 148 296 188 C 296 210 278 228 256 228 C 234 228 216 210 216 188 C 216 160 236 136 236 108 C 236 108 244 92 256 76 Z" fill="url(#flameGrad)" />

  <!-- Geometric Code Sparkles (Left & Right) -->
  <path d="M 180 140 L 190 160 L 210 170 L 190 180 L 180 200 L 170 180 L 150 170 L 170 160 Z" fill="#FFC107" opacity="0.85" />
  <path d="M 332 120 L 340 136 L 356 144 L 340 152 L 332 168 L 324 152 L 308 144 L 324 136 Z" fill="#FF9800" opacity="0.85" />

  <!-- Inner Highlighting -->
  <line x1="120" y1="228" x2="410" y2="228" stroke="#79C0FF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
</svg>
