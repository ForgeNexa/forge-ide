name: CI — Cross-Platform Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]
        go-version: ['1.23.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: services/forge-daemon/go.sum

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Run Go Unit & Race Tests
        shell: bash
        run: |
          cd services/forge-daemon
          go fmt ./...
          go vet ./...
          go test -v -race ./...

      - name: Build Go Daemon
        shell: bash
        run: |
          cd services/forge-daemon
          go build -o bin/forge-daemon ./cmd/forge-daemon
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o bin/forge-daemon.exe ./cmd/forge-daemon
          fi

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo Workspaces & Assets
        run: pnpm run build

      - name: Run Monorepo Test Flows
        run: pnpm test
