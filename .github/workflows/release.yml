name: Release — Cross-Platform Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-daemon:
    name: Cross-Compile Go Daemon
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            output: forge-daemon-darwin-arm64
          - goos: darwin
            goarch: amd64
            output: forge-daemon-darwin-amd64
          - goos: linux
            goarch: amd64
            output: forge-daemon-linux-amd64
          - goos: linux
            goarch: arm64
            output: forge-daemon-linux-arm64
          - goos: windows
            goarch: amd64
            output: forge-daemon-windows-amd64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Cross-compile binary
        run: |
          cd services/forge-daemon
          mkdir -p ../../dist-bin
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o ../../dist-bin/${{ matrix.output }} ./cmd/forge-daemon

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist-bin/${{ matrix.output }}

  build-desktop:
    name: Package Desktop App on ${{ matrix.os }}
    needs: build-daemon
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build Local Go Daemon
        shell: bash
        run: |
          cd services/forge-daemon
          go build -o bin/forge-daemon ./cmd/forge-daemon
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -o bin/forge-daemon.exe ./cmd/forge-daemon
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Renderer & Shared Protocol
        run: pnpm run build

      - name: Package with Electron Builder
        shell: bash
        run: |
          pnpm run package --if-present || true

  publish-release:
    name: Publish GitHub Release
    needs: [build-daemon, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all daemon artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
